<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a9d6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plano de Estudos</title>
<style>
/* Layout: menu lateral fixo + área de conteúdo; no celular o menu vira gaveta. Cada disciplina tem um matiz (--h) para os cartões. */
:root{--bg:#f5f7f6;--card:#fff;--side:#fff;--ink:#1f2a33;--muted:#6b7680;--line:#e3e8e6;--accent:#2a9d6f;--accent-ink:#1f7a56;--accent-soft:#e2f4ec;--good:#2a9d6f;--bad:#d24b4b;--warn:#b7791f;--aviso:#fff4d6;--good-soft:#dff3e8;--bad-soft:#f9e1e0;--warn-soft:#faefd9;--soft:#eef2f1;--card-l:92%;--card-s:70%;--card-b:76%;--card-ink:28%;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1513;--card:#161e1b;--side:#131a18;--ink:#e3ebe7;--muted:#93a29c;--line:#26322e;--accent:#3fbf8a;--accent-ink:#7fdcb4;--accent-soft:#183329;--good:#4cc794;--bad:#ec7a7a;--warn:#e0a54f;--aviso:#3a2f10;--good-soft:#173126;--bad-soft:#3b2121;--warn-soft:#382c16;--soft:#1b2522;--card-l:22%;--card-s:32%;--card-b:34%;--card-ink:86%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--card:#161e1b;--side:#131a18;--ink:#e3ebe7;--muted:#93a29c;--line:#26322e;--accent:#3fbf8a;--accent-ink:#7fdcb4;--accent-soft:#183329;--good:#4cc794;--bad:#ec7a7a;--warn:#e0a54f;--aviso:#3a2f10;--good-soft:#173126;--bad-soft:#3b2121;--warn-soft:#382c16;--soft:#1b2522;--card-l:22%;--card-s:32%;--card-b:34%;--card-ink:86%;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.marca{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:17px;color:var(--accent-ink)}
.marca img{width:30px;height:30px;border-radius:8px}
.plano-atual{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--bg);cursor:pointer;text-align:left;color:var(--ink);width:100%;font:inherit}
.plano-atual b{display:block;font-size:13.5px}
.plano-atual span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);background:transparent;border:0;font:inherit;font-size:14px;cursor:pointer;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav.on svg{color:var(--accent-ink)}
.nav .qtd{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px}
.side .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.topo{display:none}
.conteudo{min-width:0;display:flex;flex-direction:column}
main{width:100%;max-width:1240px;margin:0 auto;padding:22px 26px 80px;display:grid;gap:16px}
.titulo-pg{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.titulo-pg h1{font-size:22px;margin:0}
.titulo-pg p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:12px;margin:0 0 12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card h3{font-size:15px;margin:0 0 6px}
.big{font-size:26px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;border:0;border-radius:9px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-weight:600}
button:hover{filter:brightness(1.05)}
button.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
button.danger{background:var(--bad)}
button.small{padding:4px 10px;font-size:12.5px}
button.icone{background:transparent;border:1px solid var(--line);color:var(--ink);padding:5px 10px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.dcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;width:100%;background:var(--card);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
form.fields,.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar>div{height:100%;background:var(--accent);border-radius:4px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.tag{letter-spacing:.05em;text-transform:uppercase;font-size:10.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 60% 55%);flex:none}
p{margin:6px 0}
[hidden]{display:none!important}
.aviso{background:var(--aviso);border:1px solid #e0a100;border-radius:10px;padding:10px 14px;margin:14px 26px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.aviso button{background:#b07d00}
.dica{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px}
/* cartões de sessão coloridos por disciplina */
.dcard{white-space:normal;background:hsl(var(--h) var(--card-s) var(--card-l));border:1px solid hsl(var(--h) 40% var(--card-b));border-radius:10px;padding:8px 9px;font-size:12.5px;cursor:pointer;display:grid;gap:3px;text-align:left;color:var(--ink);width:100%;font-weight:400}
.dcard .dn{font-weight:700;color:hsl(var(--h) 45% var(--card-ink));font-size:12px}
.dcard .tp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .mt{display:flex;gap:8px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.dcard.feita{opacity:.62}
.dcard.feita .tp{text-decoration:line-through}
.dcard.atrasada{box-shadow:inset 3px 0 0 var(--bad)}
.tcard{white-space:normal;text-align:left;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 9px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
/* planejamento semanal */
.plan{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.semnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.semnav .mes{font-size:17px;font-weight:700}
.semnav .faixa{font-size:12px;color:var(--muted)}
.redondo{width:30px;height:30px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);font-size:17px;line-height:1}
.anel{width:34px;height:34px}
.semana-wrap{overflow-x:auto;margin-top:14px;padding-bottom:4px}
.semana-grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px}
.dia{display:grid;gap:7px;align-content:start;min-width:0}
.dia .cab{text-align:center;padding:6px 4px;border-radius:10px;background:var(--soft)}
.dia .cab b{display:block;font-size:13px}
.dia .cab span{font-size:11px;color:var(--muted)}
.dia.hoje .cab{background:var(--accent);color:#fff}
.dia.hoje .cab span{color:#fff;opacity:.9}
.dia .vazio{color:var(--muted);font-size:12px;text-align:center;padding:10px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal .h{color:var(--muted);font-weight:700;font-size:10.5px;padding:4px 0}
.cal button{background:transparent;color:var(--ink);padding:5px 0;border-radius:8px;font-weight:500;position:relative}
.cal button.fora{color:var(--muted);opacity:.5}
.cal button.sem{background:var(--accent-soft)}
.cal button.hj{background:var(--accent);color:#fff;font-weight:700}
.cal button i{position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.distr{display:grid;gap:7px;font-size:13px}
.distr div{display:flex;gap:8px;align-items:center}
.distr b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
/* listas */
.lin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.lin:first-child{border-top:0}
.lin .ic{width:38px;height:38px;border-radius:10px;background:hsl(var(--h) var(--card-s) var(--card-l));border:1px solid hsl(var(--h) 40% var(--card-b));display:grid;place-items:center;font-weight:800;font-size:11px;color:hsl(var(--h) 45% var(--card-ink))}
.lin .tt{font-weight:600}
.lin .ds{color:hsl(var(--h) 45% var(--card-ink));font-weight:600;font-size:13px}
.lin .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.lin input[type=date]{width:150px}
.revs{display:flex;gap:4px}
.revs button{padding:2px 7px;font-size:11.5px;background:var(--soft);color:var(--muted);border:1px solid var(--line);font-weight:600}
.revs button.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.revs button:disabled{opacity:.4;cursor:default}
.subabas{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.subabas button{background:transparent;color:var(--muted);border-radius:0;padding:8px 2px;border-bottom:2px solid transparent;font-weight:600}
.subabas button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.subabas button span{font-size:11px;margin-left:4px;opacity:.8}
details.semana{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.semana>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 16px}
details.semana>summary::-webkit-details-marker{display:none}
details.semana>summary b{font-size:15px}
details.semana .corpo{padding:0 16px 8px}
details.semana.atual{border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:130px}
.prog .bar{flex:1}
.acc-linha{display:grid;grid-template-columns:minmax(120px,240px) 1fr 48px;gap:10px;align-items:center;font-size:13.5px;margin:7px 0}
.acc-linha .trk{position:relative;height:12px;background:var(--soft);border-radius:6px}
.acc-linha .trk i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.acc-linha .trk b{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--ink);opacity:.45}
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.disc{border-top:4px solid hsl(var(--h) 55% 60%)}
ol.passos,ul.lista{margin:0;padding-left:20px;display:grid;gap:6px}
code{font-size:12px;overflow-wrap:anywhere;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:10;background:#1f2a33;color:#fff;border-radius:10px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast button{background:rgba(255,255,255,.18)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:9;display:grid;place-items:center;padding:16px}
.modal>.card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:10px}
.planos{display:grid;gap:8px}
.planos label{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px;cursor:pointer}
.planos label.on{border-color:var(--accent);background:var(--accent-soft)}
.fundo{display:none}
@media(max-width:1100px){.plan{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:20;width:260px;transform:translateX(-100%);transition:transform .2s}
  body.menu .side{transform:none}
  body.menu .fundo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
  .topo{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .topo b{font-size:15px}
  .topo span{font-size:12px;color:var(--muted)}
  main{padding:14px 12px 80px}
  .aviso{margin:10px 12px 0}
  .semana-grid{grid-template-columns:1fr}
  .semana-wrap{overflow:visible}
  .dia{grid-template-columns:72px minmax(0,1fr);align-items:start}
  .dia .cab{grid-row:span 20}
  .lin{grid-template-columns:auto minmax(0,1fr)}
  .lin .ctl{grid-column:1/-1;justify-content:flex-start}
  .acc-linha{grid-template-columns:1fr 44px}.acc-linha .trk{grid-column:1/-1;grid-row:2}
  form.fields,.filtros{grid-template-columns:1fr 1fr}
}
@media(max-width:380px){form.fields,.filtros{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <div class="conteudo">
    <div class="topo"><button class="icone" aria-label="Abrir menu" onclick="document.body.classList.add('menu')">☰</button><div><b id="topoTitulo"></b><br><span id="topoPlano"></span></div></div>
    <div id="aviso"></div>
    <main id="conteudo"></main>
  </div>
</div>
<div class="fundo" onclick="document.body.classList.remove('menu')"></div>
<div class="modal" id="modal" hidden onclick="if (event.target === this) fecharModal()"></div>
<div class="toast" id="toast" hidden role="status"></div>
<input type="file" id="fx" accept=".xlsx,.xlsm" hidden>
<input type="file" id="fj" accept=".json,application/json" hidden>
<script src="planos.js"></script>
<script>
/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// "Hoje" pode ser fixado nos testes com window.HOJE.
const hoje = () => { if (window.HOJE) return window.HOJE; const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
// Datas como texto AAAA-MM-DD; a conta é feita em UTC para não sofrer com horário de verão.
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const iso = d => d.toISOString().slice(0, 10);
const addD = (s, n) => { const d = dt(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const dsem = s => dt(s).getUTCDay();          // 0 = domingo
const seg0 = s => (dsem(s) + 6) % 7;          // igual a DIA.DA.SEMANA(;3) da planilha: segunda = 0
const diffD = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const fmt = s => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '—');
const fmtC = s => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '—');
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);
const agoraISO = () => new Date().toISOString();
const ehData = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

/* ---------- dados ---------- */
const KEY = 'est-dados-v1';
const PL = Object.fromEntries(PLANOS.map(p => [p.id, p]));
const blankPlano = p => ({ cfg: { inicio: p.inicio, ritmo: p.ritmo, alvo: p.alvo }, feitas: {}, revs: {}, tarefas: {}, notas: {},
  questoes: [], escrita: {}, interesse: {}, taf: { sexo: 'M', alvos: {}, registros: [] } });
const blank = () => ({ v: 1, ativo: PLANOS[0].id, planos: {} });
function carregar() {
  try { const t = localStorage.getItem(KEY); if (t) return Object.assign(blank(), JSON.parse(t)); } catch (e) {}
  return blank();
}
let S = carregar();
let falhaSalvar = false;
function salvar() { try { localStorage.setItem(KEY, JSON.stringify(S)); falhaSalvar = false; } catch (e) { falhaSalvar = true; } }
function commit() { S.modificadoEm = agoraISO(); salvar(); render(); agendarEnvio(); }
const P = () => PL[S.ativo] || PLANOS[0];
// Dados do plano ativo; cria o que faltar (plano novo ou campo novo de uma versão mais recente do app).
function D(p = P()) {
  if (!S.planos[p.id]) S.planos[p.id] = blankPlano(p);
  const d = S.planos[p.id], b = blankPlano(p);
  for (const k in b) if (d[k] === undefined || d[k] === null) d[k] = b[k];
  for (const k in b.cfg) if (d.cfg[k] === undefined) d.cfg[k] = b.cfg[k];
  for (const k in b.taf) if (d.taf[k] === undefined) d.taf[k] = b.taf[k];
  return d;
}
const nomeDisc = (p, k) => (p.disciplinas.find(x => x.k === k) || { nome: k }).nome;

/* ---------- cálculos (os mesmos da planilha) ---------- */
const REVS = [[1, '24 h', '10 min'], [7, '7 dias', '15 min'], [30, '30 dias', '20 min']];
// Data prevista da sessão n (1, 2, ...): DIATRABALHOTOTAL(Início - 1; INT((n-1)/Ritmo) + 1), sem feriados.
function datasPrevistas(inicio, ritmo, total) {
  const out = []; let cur = addD(inicio, -1), k = 0;
  for (let i = 0; i < total; i++) {
    const alvo = Math.floor(i / ritmo) + 1;
    while (k < alvo) { cur = addD(cur, 1); if (seg0(cur) < 5) k++; }
    out.push(cur);
  }
  return out;
}
function calc(p = P(), d = D(p), h = hoje()) {
  const ritmo = Number(d.cfg.ritmo) === 3 ? 3 : 2, ini = ehData(d.cfg.inicio) ? d.cfg.inicio : p.inicio;
  const seg = addD(ini, -seg0(ini));
  const datas = datasPrevistas(ini, ritmo, p.sessoes.length);
  const linhas = p.sessoes.map((s, i) => {
    const data = datas[i], semana = Math.floor(diffD(seg, data) / 7) + 1, feita = d.feitas[s.id] || '';
    const revs = REVS.map(([n]) => ({ n, data: feita ? addD(feita, n) : '', feito: !!d.revs[s.id + '@' + n] }));
    const prox = feita ? (revs.find(r => !r.feito) || null) : null;
    const sit = feita ? (!prox ? 'Ciclo completo' : (prox.data <= h ? 'Revisão vencida' : 'Em dia')) : (data < h ? 'Atrasada' : 'Pendente');
