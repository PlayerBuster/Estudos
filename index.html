<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2a9d6f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Estudos">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Plano de Estudos</title>
<style>
/* Layout: menu lateral fixo + área de conteúdo; no celular o menu vira gaveta. Cada disciplina tem um matiz (--h) para os cartões. */
:root{--bg:#f5f7f6;--card:#fff;--side:#fff;--ink:#1f2a33;--muted:#6b7680;--line:#e3e8e6;--accent:#2a9d6f;--accent-ink:#1f7a56;--accent-soft:#e2f4ec;--good:#2a9d6f;--bad:#d24b4b;--warn:#b7791f;--aviso:#fff4d6;--good-soft:#dff3e8;--bad-soft:#f9e1e0;--warn-soft:#faefd9;--soft:#eef2f1;--card-l:92%;--card-s:70%;--card-b:76%;--card-ink:28%;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0f1513;--card:#161e1b;--side:#131a18;--ink:#e3ebe7;--muted:#93a29c;--line:#26322e;--accent:#3fbf8a;--accent-ink:#7fdcb4;--accent-soft:#183329;--good:#4cc794;--bad:#ec7a7a;--warn:#e0a54f;--aviso:#3a2f10;--good-soft:#173126;--bad-soft:#3b2121;--warn-soft:#382c16;--soft:#1b2522;--card-l:22%;--card-s:32%;--card-b:34%;--card-ink:86%;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1513;--card:#161e1b;--side:#131a18;--ink:#e3ebe7;--muted:#93a29c;--line:#26322e;--accent:#3fbf8a;--accent-ink:#7fdcb4;--accent-soft:#183329;--good:#4cc794;--bad:#ec7a7a;--warn:#e0a54f;--aviso:#3a2f10;--good-soft:#173126;--bad-soft:#3b2121;--warn-soft:#382c16;--soft:#1b2522;--card-l:22%;--card-s:32%;--card-b:34%;--card-ink:86%;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;background:var(--bg);color:var(--ink);font-size:14.5px;line-height:1.45}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--side);border-right:1px solid var(--line);padding:16px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow-y:auto}
.marca{display:flex;align-items:center;gap:10px;padding:4px 8px 14px;font-weight:700;font-size:17px;color:var(--accent-ink)}
.marca img{width:30px;height:30px;border-radius:8px}
.plano-atual{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;margin-bottom:10px;background:var(--bg);cursor:pointer;text-align:left;color:var(--ink);width:100%;font:inherit}
.plano-atual b{display:block;font-size:13.5px}
.plano-atual span{font-size:12px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--ink);background:transparent;border:0;font:inherit;font-size:14px;cursor:pointer;width:100%;text-align:left}
.nav svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;color:var(--muted)}
.nav:hover{background:var(--soft)}
.nav.on{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.nav.on svg{color:var(--accent-ink)}
.nav .qtd{margin-left:auto;font-size:11.5px;font-weight:700;background:var(--warn-soft);color:var(--warn);border-radius:999px;padding:1px 7px}
.side .sec{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 10px 4px}
.topo{display:none}
.conteudo{min-width:0;display:flex;flex-direction:column}
main{width:100%;max-width:1240px;margin:0 auto;padding:22px 26px 80px;display:grid;gap:16px}
.titulo-pg{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.titulo-pg h1{font-size:22px;margin:0}
.titulo-pg p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h2{font-size:12px;margin:0 0 12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.card h3{font-size:15px;margin:0 0 6px}
.big{font-size:26px;font-weight:700;margin:2px 0;font-variant-numeric:tabular-nums}
.pos{color:var(--good)}.neg{color:var(--bad)}.warn{color:var(--warn)}
button{font:inherit;border:0;border-radius:9px;padding:8px 14px;background:var(--accent);color:#fff;cursor:pointer;white-space:nowrap;font-weight:600}
button:hover{filter:brightness(1.05)}
button.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
button.danger{background:var(--bad)}
button.small{padding:4px 10px;font-size:12.5px}
button.icone{background:transparent;border:1px solid var(--line);color:var(--ink);padding:5px 10px;font-weight:700}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible,.dcard:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:9px;width:100%;background:var(--card);color:var(--ink)}
input[type=checkbox],input[type=radio]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
label{display:grid;gap:4px;font-size:12.5px;color:var(--muted)}
form.fields,.filtros{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);font-size:13.5px;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
td.num,th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:60px}
.bar>div{height:100%;background:var(--accent);border-radius:4px}
.muted{color:var(--muted);font-size:13px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.acc{background:var(--accent-soft);color:var(--accent-ink)}
.chip.tag{letter-spacing:.05em;text-transform:uppercase;font-size:10.5px}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:hsl(var(--h) 60% 55%);flex:none}
p{margin:6px 0}
[hidden]{display:none!important}
.aviso{background:var(--aviso);border:1px solid #e0a100;border-radius:10px;padding:10px 14px;margin:14px 26px 0;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.aviso button{background:#b07d00}
.dica{display:flex;gap:10px;align-items:flex-start;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:13.5px}
/* cartões de sessão coloridos por disciplina */
.dcard{white-space:normal;background:hsl(var(--h) var(--card-s) var(--card-l));border:1px solid hsl(var(--h) 40% var(--card-b));border-radius:10px;padding:8px 9px;font-size:12.5px;cursor:pointer;display:grid;gap:3px;text-align:left;color:var(--ink);width:100%;font-weight:400}
.dcard .dn{font-weight:700;color:hsl(var(--h) 45% var(--card-ink));font-size:12px}
.dcard .tp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dcard .mt{display:flex;gap:8px;color:var(--muted);font-size:11.5px;flex-wrap:wrap}
.dcard.feita{opacity:.62}
.dcard.feita .tp{text-decoration:line-through}
.dcard.atrasada{box-shadow:inset 3px 0 0 var(--bad)}
.tcard{white-space:normal;text-align:left;background:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 9px;font-size:12.5px;display:flex;gap:8px;align-items:flex-start}
/* planejamento semanal */
.plan{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:16px;align-items:start}
.semnav{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.semnav .mes{font-size:17px;font-weight:700}
.semnav .faixa{font-size:12px;color:var(--muted)}
.redondo{width:30px;height:30px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--accent);font-size:17px;line-height:1}
.anel{width:34px;height:34px}
.semana-wrap{overflow-x:auto;margin-top:14px;padding-bottom:4px}
.semana-grid{display:grid;grid-template-columns:repeat(7,minmax(128px,1fr));gap:8px}
.dia{display:grid;gap:7px;align-content:start;min-width:0}
.dia .cab{text-align:center;padding:6px 4px;border-radius:10px;background:var(--soft)}
.dia .cab b{display:block;font-size:13px}
.dia .cab span{font-size:11px;color:var(--muted)}
.dia.hoje .cab{background:var(--accent);color:#fff}
.dia.hoje .cab span{color:#fff;opacity:.9}
.dia .vazio{color:var(--muted);font-size:12px;text-align:center;padding:10px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}
.cal .h{color:var(--muted);font-weight:700;font-size:10.5px;padding:4px 0}
.cal button{background:transparent;color:var(--ink);padding:5px 0;border-radius:8px;font-weight:500;position:relative}
.cal button.fora{color:var(--muted);opacity:.5}
.cal button.sem{background:var(--accent-soft)}
.cal button.hj{background:var(--accent);color:#fff;font-weight:700}
.cal button i{position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.distr{display:grid;gap:7px;font-size:13px}
.distr div{display:flex;gap:8px;align-items:center}
.distr b{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
/* listas */
.lin{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px 14px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.lin:first-child{border-top:0}
.lin .ic{width:38px;height:38px;border-radius:10px;background:hsl(var(--h) var(--card-s) var(--card-l));border:1px solid hsl(var(--h) 40% var(--card-b));display:grid;place-items:center;font-weight:800;font-size:11px;color:hsl(var(--h) 45% var(--card-ink))}
.lin .tt{font-weight:600}
.lin .ds{color:hsl(var(--h) 45% var(--card-ink));font-weight:600;font-size:13px}
.lin .ctl{display:flex;gap:6px;flex-wrap:wrap;align-items:center;justify-content:flex-end}
.lin input[type=date]{width:150px}
.revs{display:flex;gap:4px}
.revs button{padding:2px 7px;font-size:11.5px;background:var(--soft);color:var(--muted);border:1px solid var(--line);font-weight:600}
.revs button.on{background:var(--good-soft);color:var(--good);border-color:transparent}
.revs button:disabled{opacity:.4;cursor:default}
.subabas{display:flex;gap:18px;border-bottom:1px solid var(--line);overflow-x:auto}
.subabas button{background:transparent;color:var(--muted);border-radius:0;padding:8px 2px;border-bottom:2px solid transparent;font-weight:600}
.subabas button.on{color:var(--accent-ink);border-bottom-color:var(--accent)}
.subabas button span{font-size:11px;margin-left:4px;opacity:.8}
details.semana{background:var(--card);border:1px solid var(--line);border-radius:14px}
details.semana>summary{cursor:pointer;list-style:none;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;padding:12px 16px}
details.semana>summary::-webkit-details-marker{display:none}
details.semana>summary b{font-size:15px}
details.semana .corpo{padding:0 16px 8px}
details.semana.atual{border-color:var(--accent)}
.prog{display:flex;align-items:center;gap:8px;margin-left:auto;min-width:130px}
.prog .bar{flex:1}
.acc-linha{display:grid;grid-template-columns:minmax(120px,240px) 1fr 48px;gap:10px;align-items:center;font-size:13.5px;margin:7px 0}
.acc-linha .trk{position:relative;height:12px;background:var(--soft);border-radius:6px}
.acc-linha .trk i{position:absolute;inset:0 auto 0 0;border-radius:6px}
.acc-linha .trk b{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--ink);opacity:.45}
.discs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.disc{border-top:4px solid hsl(var(--h) 55% 60%)}
ol.passos,ul.lista{margin:0;padding-left:20px;display:grid;gap:6px}
code{font-size:12px;overflow-wrap:anywhere;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:10;background:#1f2a33;color:#fff;border-radius:10px;padding:8px 10px 8px 14px;display:flex;gap:10px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 4px 16px rgba(0,0,0,.3)}
.toast button{background:rgba(255,255,255,.18)}
.modal{position:fixed;inset:0;background:rgba(10,20,15,.45);z-index:9;display:grid;place-items:center;padding:16px}
.modal>.card{width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto;display:grid;gap:10px}
.planos{display:grid;gap:8px}
.planos label{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px;color:var(--ink);font-size:14px;cursor:pointer}
.planos label.on{border-color:var(--accent);background:var(--accent-soft)}
.fundo{display:none}
textarea{resize:vertical;line-height:1.45}
.crono{position:fixed;right:16px;bottom:16px;z-index:8;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--card);border:1px solid var(--accent);border-radius:14px;padding:8px 10px 8px 14px;box-shadow:0 6px 20px rgba(0,0,0,.18);max-width:calc(100vw - 32px)}
.crono .tempo{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent-ink)}
.heat{display:flex;gap:3px}
.hcol{display:grid;grid-template-rows:repeat(7,14px);gap:3px}
.hcol.dias span{font-size:10px;color:var(--muted);line-height:14px;padding-right:4px}
.hm{display:inline-block;width:14px;height:14px;border-radius:3px;background:var(--soft)}
.hm.n1{background:color-mix(in srgb,var(--accent) 30%,var(--soft))}.hm.n2{background:color-mix(in srgb,var(--accent) 55%,var(--soft))}
.hm.n3{background:color-mix(in srgb,var(--accent) 80%,var(--soft))}.hm.n4{background:var(--accent)}.hm.n-1{background:transparent}
.row .hm{vertical-align:middle}
@media(max-width:1100px){.plan{grid-template-columns:1fr}}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;left:0;top:0;bottom:0;z-index:20;width:260px;transform:translateX(-100%);transition:transform .2s}
  body.menu .side{transform:none}
  body.menu .fundo{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:19}
  .topo{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--side);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
  .topo b{font-size:15px}
  .topo span{font-size:12px;color:var(--muted)}
  main{padding:14px 12px 80px}
  .aviso{margin:10px 12px 0}
  .semana-grid{grid-template-columns:1fr}
  .semana-wrap{overflow:visible}
  .dia{grid-template-columns:72px minmax(0,1fr);align-items:start}
  .dia .cab{grid-row:span 20}
  .lin{grid-template-columns:auto minmax(0,1fr)}
  .lin .ctl{grid-column:1/-1;justify-content:flex-start}
  .acc-linha{grid-template-columns:1fr 44px}.acc-linha .trk{grid-column:1/-1;grid-row:2}
  form.fields,.filtros{grid-template-columns:1fr 1fr}
}
@media(max-width:380px){form.fields,.filtros{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){.side{transition:none}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Menu"></aside>
  <div class="conteudo">
    <div class="topo"><button class="icone" aria-label="Abrir menu" onclick="document.body.classList.add('menu')">☰</button><div><b id="topoTitulo"></b><br><span id="topoPlano"></span></div></div>
    <div id="aviso"></div>
    <main id="conteudo"></main>
  </div>
</div>
<div class="fundo" onclick="document.body.classList.remove('menu')"></div>
<div class="modal" id="modal" hidden onclick="if (event.target === this) fecharModal()"></div>
<div class="toast" id="toast" hidden role="status"></div>
<div class="crono" id="crono" hidden role="timer" aria-live="off"></div>
<input type="file" id="fx" accept=".xlsx,.xlsm" hidden>
<input type="file" id="fj" accept=".json,application/json" hidden>
<input type="file" id="fp" accept=".json,application/json" hidden>
<script src="planos.js"></script>
<script>
/* ---------- utilidades ---------- */
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
// "Hoje" pode ser fixado nos testes com window.HOJE.
const hoje = () => { if (window.HOJE) return window.HOJE; const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
// Datas como texto AAAA-MM-DD; a conta é feita em UTC para não sofrer com horário de verão.
const dt = s => { const [y, m, d] = s.split('-').map(Number); return new Date(Date.UTC(y, m - 1, d)); };
const iso = d => d.toISOString().slice(0, 10);
const addD = (s, n) => { const d = dt(s); d.setUTCDate(d.getUTCDate() + n); return iso(d); };
const dsem = s => dt(s).getUTCDay();          // 0 = domingo
const seg0 = s => (dsem(s) + 6) % 7;          // igual a DIA.DA.SEMANA(;3) da planilha: segunda = 0
const diffD = (a, b) => Math.round((dt(b) - dt(a)) / 864e5);
const fmt = s => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : '—');
const fmtC = s => (s ? `${s.slice(8, 10)}/${s.slice(5, 7)}` : '—');
const DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
const MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const pct = (a, b) => (b ? Math.round(a / b * 100) : 0);
const agoraISO = () => new Date().toISOString();
const ehData = s => /^\d{4}-\d{2}-\d{2}$/.test(String(s || ''));

/* ---------- dados ---------- */
const KEY = 'est-dados-v1';
// Planos prontos (planos.js) e planos criados por você (S.custom), montados juntos em PL por montarRegistro().
const BASE = PLANOS;
let PL = {};
const ritmoDe = v => { const n = Math.round(Number(v)); return n >= 1 && n <= 4 ? n : 2; };
const blankPlano = p => ({ cfg: { inicio: p.inicio, ritmo: p.ritmo, alvo: p.alvo, folgas: {}, metaHoras: '' }, feitas: {}, revs: {}, tarefas: {}, notas: {},
  questoes: [], escrita: {}, interesse: {}, taf: { sexo: 'M', alvos: {}, registros: [] }, tempos: [], anotacoes: {} });
const blank = () => ({ v: 1, ativo: PLANOS[0].id, planos: {}, custom: {} });
function carregar() {
  try { const t = localStorage.getItem(KEY); if (t) return Object.assign(blank(), JSON.parse(t)); } catch (e) {}
  return blank();
}
let S = carregar();
let falhaSalvar = false;
function salvar() { try { localStorage.setItem(KEY, JSON.stringify(S)); falhaSalvar = false; } catch (e) { falhaSalvar = true; } }
function commit() { S.modificadoEm = agoraISO(); salvar(); render(); agendarEnvio(); }
const P = () => { if (!PL[BASE[0].id]) montarRegistro(); return PL[S.ativo] || BASE[0]; };
// Dados do plano ativo; cria o que faltar (plano novo ou campo novo de uma versão mais recente do app).
function D(p = P()) {
  if (!S.planos[p.id]) S.planos[p.id] = blankPlano(p);
  const d = S.planos[p.id], b = blankPlano(p);
  for (const k in b) if (d[k] === undefined || d[k] === null) d[k] = b[k];

// Minutos estudados por dia: o tempo do cronômetro; sem cronômetro, cada sessão concluída vale a duração padrão.
function minutosPorDia(p = P(), d = D(p)) {

const SHEETJS = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';

let impMsg = '';
const setImp = t => { impMsg = t; const el = $('impStatus'); if (el) el.textContent = t; };
// Número de série do Excel (dias desde 30/12/1899) para AAAA-MM-DD.
const serialISO = v => {
  if (v instanceof Date) return iso(new Date(Date.UTC(v.getFullYear(), v.getMonth(), v.getDate())));
  if (typeof v === 'number' && v > 20000 && v < 80000) return iso(new Date(Date.UTC(1899, 11, 30) + Math.round(v) * 864e5));
  if (typeof v === 'string' && /^\d{2}\/\d{2}\/\d{4}$/.test(v.trim())) { const [dd, mm, aa] = v.trim().split('/'); return `${aa}-${mm}-${dd}`; }
  return '';
};
function detectarPlano(wb) {
  const painel = wb.Sheets['Painel'], titulo = painel && painel.A1 ? String(painel.A1.v).trim() : '';
  const porTitulo = BASE.find(p => p.titulo === titulo);
  if (porTitulo) return porTitulo;

  let melhor = null, nota = 0;
  BASE.forEach(p => { const n = p.sessoes.filter(s => codigos.has(s.id)).length / p.sessoes.length; if (n > nota) { nota = n; melhor = p; } });

// Lê o progresso no mesmo layout gerado para as planilhas (Painel, Cronograma, Semanas, Questões, escrita, Bússola, TAF).
function lerPlanilha(wb, p) {
  const v = (ws, a) => (ws && ws[a] ? ws[a].v : undefined);

  const alvo = serialISO(v(painel, 'B7')); d.cfg.alvo = alvo || '';

    const id = v(cr, 'E' + r); if (id === undefined || id === '') break;

  }

  if (sem) {
    const sim = (c, r) => String(v(sem, c + r) || '').trim().toLowerCase() === 'sim';
    for (let n = 1; n <= W; n++) {
      if (sim('F', 4 + n)) { d.tarefas['sab-' + n] = hoje(); cont.tarefas++; }
      const nota = v(sem, 'G' + (4 + n)); if (typeof nota === 'number') d.notas['sim-' + n] = nota;
    }
    const r0 = 4 + W + 3, r1 = r0 + 18;
    for (let i = 0; i < 15; i++) if (sim('F', r0 + 2 + i)) { d.tarefas['f2-' + i] = hoje(); cont.tarefas++; }
    for (let j = 0; j < 7; j++) if (sim('F', r1 + 2 + j)) { d.tarefas['f3-' + j] = hoje(); cont.tarefas++; }
  }
  const qs = wb.Sheets['Questões'], porNome = Object.fromEntries(p.disciplinas.map(x => [x.nome, x.k]));
  for (let r = 5; r <= 600 && qs; r++) {
    const nome = v(qs, 'B' + r), n = Number(v(qs, 'C' + r)), ok = Number(v(qs, 'D' + r)), temas = String(v(qs, 'F' + r) || '');
    if (!nome || !(n > 0) || temas.startsWith('Exemplo')) continue;
    if (!porNome[nome]) continue;
    d.questoes.push({ id: uid() + r, data: serialISO(v(qs, 'A' + r)) || hoje(), disc: porNome[nome], n, ok: Math.min(n, Math.max(0, ok || 0)), temas, caderno: String(v(qs, 'G' + r) || '') });

  });
  const bu = wb.Sheets['Bússola'];

    const ano = Number(d.cfg.inicio.slice(0, 4)), nT = p.bussola.length;
    for (let i = 0; i < 12; i++) {
      const r = 13 + i, m = {};
      for (let t = 0; t < nT; t++) { const x = Number(v(bu, col(1 + t) + r)); if (x >= 1 && x <= 5) m['t' + t] = x; }

    }
  }

  if (tf && p.taf) {
    const nt = p.taf.length;
    d.taf.sexo = String(v(tf, 'B4') || 'M').trim().toUpperCase() === 'F' ? 'F' : 'M';
    p.taf.forEach(([, , m, f], i) => {
      if (m === null) { const x = v(tf, 'C' + (7 + i)); if (typeof x === 'number') d.taf.alvos[i + 'M'] = x; }
      if (f === null) { const x = v(tf, 'D' + (7 + i)); if (typeof x === 'number') d.taf.alvos[i + 'F'] = x; }
    });
    for (let r = 12 + nt; r < 12 + nt + 40; r++) {
      const data = serialISO(v(tf, 'A' + r)); if (!data) continue;
      const vals = p.taf.map((_, i) => { const x = v(tf, col(1 + i) + r); return typeof x === 'number' ? x : ''; });
      d.taf.registros.push({ id: uid() + r, data, v: vals, obs: String(v(tf, col(2 + nt) + r) || '') });
    }
  }

}

      && (!b || (l.s.id + ' ' + l.s.itens.map(i => i.t).join(' ')).toLowerCase().includes(b));
    const filtrando = !!(filtro.sit || filtro.disc || b);
    const visiveis = c.linhas.filter(passa);
    const semAtual = (c.linhas.find(l => l.data >= addD(h, -seg0(h))) || c.linhas[c.linhas.length - 1]).semana;
    const grupos = [];
    visiveis.forEach(l => { const g = grupos[grupos.length - 1]; if (g && g.n === l.semana) g.ls.push(l); else grupos.push({ n: l.semana, ls: [l] }); });
    const opcoes = ['', 'Pendente', 'Atrasada', 'Revisão vencida', 'Em dia', 'Ciclo completo', 'Concluídas'];
    return `${titulo('Cronograma', `${c.total} sessões na ordem do ciclo. Marque a data em "Concluída em" ao terminar.`)}
    <section class="card"><div class="filtros">
        <label>Situação <select id="f-sit" onchange="filtro.sit=this.value;render()">${opcoes.map(o => `<option value="${o}" ${filtro.sit === o ? 'selected' : ''}>${o || 'Todas'}</option>`).join('')}</select></label>
        <label>Disciplina <select id="f-disc" onchange="filtro.disc=this.value;render()"><option value="">Todas</option>${p.disciplinas.map(x => `<option value="${x.k}" ${filtro.disc === x.k ? 'selected' : ''}>${esc(x.nome)}</option>`).join('')}</select></label>
        <label>Buscar <input id="f-busca" value="${esc(filtro.busca)}" placeholder="código ou tema" oninput="filtro.busca=this.value;agendarFiltro()"></label></div>
      ${filtrando ? `<p class="muted">${visiveis.length} sessões no filtro.</p>` : ''}</section>
    ${grupos.map(g => {
      const ls = g.ls, feitas = ls.filter(l => l.feita).length, ini = addD(c.seg, 7 * (g.n - 1));
      return `<details class="semana ${g.n === semAtual ? 'atual' : ''}" ${filtrando || g.n === semAtual ? 'open' : ''}>
        <summary><b>Semana ${g.n}</b><span class="muted">${fmtC(ini)} – ${fmtC(addD(ini, 6))}</span><span class="prog"><span class="bar"><div style="width:${pct(feitas, ls.length)}%"></div></span><span class="muted">${feitas}/${ls.length}</span></span></summary>
        <div class="corpo">${ls.map(l => `<div class="lin" style="--h:${hue(l.s.d)}"><span class="ic">${esc(l.s.d)}</span>
          <div><div class="tt">${esc(l.s.itens[0].t)}${l.s.itens.length > 1 ? ` <span class="muted">+${l.s.itens.length - 1}</span>` : ''}</div>
            <div class="row"><span class="ds">${esc(nomeDisc(p, l.s.d))}</span><span class="muted">${l.s.id} · ${DIAS[dsem(l.data)]} ${fmtC(l.data)}${l.s.p ? ' · ' + l.s.p + ' p.' : ''}</span><span class="chip ${sitClasse(l.sit)}">${l.sit}</span></div></div>
          <div class="ctl"><label style="display:flex;gap:6px;align-items:center">Concluída em <input type="date" id="cd-${l.s.id}" value="${l.feita}" onchange="concluir('${l.s.id}', this.value)"></label>
            <span class="revs">${l.revs.map(r => `<button type="button" class="${r.feito ? 'on' : ''}" ${l.feita ? '' : 'disabled'} title="Revisão de ${REVS.find(x => x[0] === r.n)[1]}${r.data ? ' em ' + fmtC(r.data) : ''}" onclick="marcarRev('${l.s.id}', ${r.n})">${r.n === 1 ? '24h' : r.n + 'd'}</button>`).join('')}</span></div></div>`).join('')}</div></details>`;
    }).join('') || '<section class="card"><p class="muted">Nenhuma sessão nesse filtro.</p></section>'}`;
  },
  disciplinas() {
    const p = P(), c = calc();

      <div class="row" style="justify-content:space-between"><h3 style="margin:0">${esc(x.nome)}</h3><span class="chip ${acertoClasse(x.acerto)}">${acertoTexto(x.acerto)}</span></div>

      <details style="margin-top:8px"><summary class="muted" style="cursor:pointer">Aulas e cadernos</summary><ol class="passos" style="margin-top:8px">${x.aulas.map(l => `<li>${esc(l.t)}${l.p ? ` <span class="muted">· ${l.p} p.</span>` : ''}${l.path ? `<br><code>${esc(l.path)}</code>` : ''}</li>`).join('')}${x.externos.map(t => `<li>${esc(t)} <span class="chip">material externo</span></li>`).join('')}</ol>

    </tbody></table></div></section>
    <section class="card"><h2>Fase 2 · revisão por disciplina</h2><div class="scroll"><table><thead><tr><th>Dia</th><th>Data</th><th>Revisar</th><th>Questões</th><th>Feito</th></tr></thead><tbody>
      ${c.dias2.map(x => `<tr><td class="num">${x.i + 1}</td><td>${DIAS[dsem(x.data)]} ${fmtC(x.data)}</td><td>${esc(nomeDisc(p, x.a))} + ${esc(nomeDisc(p, x.b))}<div class="muted">Resumos, caderno de erros e lei seca (2 h 30)</div></td><td>40 questões, 20 de cada</td><td>${ck('f2-' + x.i)}</td></tr>`).join('')}
    </tbody></table></div></section>
    <section class="card"><h2>Fase 3 · ${esc(p.fase3)}</h2><div class="scroll"><table><thead><tr><th>Dia</th><th>Data</th><th>Tarefa</th><th>Feito</th></tr></thead><tbody>

    </tbody></table></div></section>`;

  questoes() {

      <form class="fields" onsubmit="addQuestoes(event)">

        <label>Data <input type="date" name="q_data" value="${hoje()}"></label>
        <label>Questões <input type="number" name="q_n" min="1" max="500" value="15" inputmode="numeric"></label>
        <label>Acertos <input type="number" name="q_ok" min="0" max="500" inputmode="numeric" required></label>

        <button>Registrar</button>
      </form><p class="muted" id="qMsg"></p></section>

        return `<div class="acc-linha" style="--h:${hue(x.k)}"><span class="row" style="gap:6px"><span class="dot"></span>${esc(x.nome)} <span class="muted">${x.q ? x.q + ' q' : ''}</span></span><span class="trk"><i style="width:${a === null ? 0 : Math.round(a * 100)}%;background:${cor}"></i><b title="meta de 80%"></b></span><span class="num" style="text-align:right">${a === null ? '—' : Math.round(a * 100) + '%'}</span></div>`; }).join('')}
      <p class="muted">A linha marca 80%. Verde a partir de 80%, âmbar de 65% a 79%, vermelho abaixo de 65%.</p></section>

      ${hist.length ? `<div class="scroll"><table><thead><tr><th>Data</th><th>Disciplina</th><th class="num">Acertos</th><th class="num">%</th><th>Temas que errou</th><th></th></tr></thead><tbody>
        ${hist.map(q => `<tr><td>${fmtC(q.data)}</td><td><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="dot" style="--h:${hue(q.disc)}"></span>${esc(nomeDisc(p, q.disc))}</span></td><td class="num">${q.ok}/${q.n}</td><td class="num"><span class="chip ${acertoClasse(q.ok / q.n)}">${pct(q.ok, q.n)}%</span></td><td>${esc(q.temas)}${q.caderno ? `<div class="muted">${esc(q.caderno)}</div>` : ''}</td><td><button class="small ghost" onclick="delQuestao('${q.id}')">Apagar</button></td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">Nenhuma bateria ainda. Depois da primeira sessão, faça as questões indicadas e registre aqui.</p>'}</section>`;
  },
  escrita() {
    const p = P(), d = D(), e = p.escrita;
    const feitos = Object.values(d.escrita).filter(x => x.data).length;

      <p class="muted" style="margin-top:10px">${feitos} de ${e.temas.length} treinados${notas.length ? ` · nota média ${(notas.reduce((a, n) => a + Number(n), 0) / notas.length).toFixed(1)}` : ''}. No calendário, um tema entra todo sábado a partir da semana 3.</p></section>

  bussola() {

    <section class="card"><div class="scroll"><table><thead><tr><th>Trilha</th><th class="num">Acerto</th><th class="num">Interesse</th><th class="num">Pontuação</th><th class="num">Posição</th></tr></thead><tbody>
      ${ls.map(l => `<tr><td><b>${esc(l.nome)}</b><div class="muted">${esc(l.carreiras)}</div><div class="muted">${l.keys.map(k => esc(nomeDisc(p, k))).join(', ')}</div></td>
        <td class="num">${l.acerto === null ? '—' : Math.round(l.acerto * 100) + '%'}</td><td class="num">${l.interesse === null ? '—' : l.interesse.toFixed(1)}</td>
        <td class="num"><b>${l.pontos === null ? '—' : l.pontos.toFixed(1)}</b></td><td class="num">${l.posicao ? `<span class="chip ${l.posicao === 1 ? 'ok' : ''}">${l.posicao}º</span>` : '—'}</td></tr>`).join('')}

      ${MESES.map((m, i) => { const k = `${ano}-${pad(i + 1)}`, x = d.interesse[k] || {}; return `<tr><td>${m}/${ano}</td>${p.bussola.map((_, t) => `<td><select id="int-${k}-${t}" aria-label="Interesse" onchange="setInteresse('${k}', 't${t}', this.value)" style="width:70px"><option value="">—</option>${[1, 2, 3, 4, 5].map(n => `<option ${x['t' + t] === n ? 'selected' : ''}>${n}</option>`).join('')}</select></td>`).join('')}

    <section class="card"><h2>Índices</h2>
      <div class="row"><label style="max-width:160px">Sexo <select id="taf-sexo" onchange="setSexo(this.value)"><option value="M" ${d.taf.sexo !== 'F' ? 'selected' : ''}>Masculino</option><option value="F" ${d.taf.sexo === 'F' ? 'selected' : ''}>Feminino</option></select></label></div>

      <p class="muted">Rotina sugerida: corrida e abdominal 3 vezes por semana, barra e saltos 2 vezes, natação no fim de semana. Faça avaliação médica e procure um educador físico antes de aumentar a carga.</p></section>`;

  metodo() {
    const p = P();
    const BANCAS = {
      'FGV': ['A FGV traz enunciados longos e casos práticos. Treine leitura rápida e identifique o que a questão realmente pergunta.', 'Cobra jurisprudência recente e interpretação da lei, não só o texto seco.', 'Faça provas anteriores da FGV com tempo: o cansaço é parte da dificuldade.'],
      'Vunesp': ['A Vunesp cobra muito texto de lei e conceitos diretos, com alternativas parecidas.', 'Português pesa bastante: gramática normativa e interpretação.', 'Resolva provas anteriores da própria banca: ela repete estilos e temas.'],
      'FCC': ['Prova objetiva com Gerais (peso 1) e Específicos (peso 2). Dê 2 de cada 3 sessões às disciplinas jurídicas.', 'A FCC é literal: cobra o texto da CLT, da CF, do CPC e das súmulas do TST. Depois de cada aula, leia os artigos citados.', 'O estudo de caso tem 15 a 30 linhas. Treine com o relógio: 3 minutos por questão e 50 minutos por caso.'],
      'Instituto AOCP': ['O Instituto AOCP cobra muito texto de lei e conceito direto. Depois de cada aula, leia os artigos citados.', 'Múltipla escolha com 5 alternativas: treine eliminando alternativas e desconfie de "sempre", "nunca" e prazos trocados.', 'A redação elimina: escreva uma por semana desde cedo e peça correção quando puder.'],
      'Cebraspe': ['No edital PC-PE 2026 a prova é de múltipla escolha (A a E), sem desconto por erro: responda todas as questões.', 'O Cebraspe adora exceções e jurisprudência do STF e do STJ. Leia os informativos citados nas aulas de Penal e Processo Penal.', 'Treine também itens de certo ou errado: o Cebraspe usa esse formato em outros concursos e ele força leitura precisa.'],
      'Multibanca': ['FCC (tribunais): muito texto de lei e súmula, literal. Leia a lei seca depois de cada aula.', 'Cebraspe (polícias e tribunais): exceções, jurisprudência e, em muitos concursos, certo ou errado com desconto por erro.', 'FGV e Instituto AOCP: enunciados longos, casos práticos e interpretação. Treine leitura rápida e eliminação de alternativas.', 'Varie as bancas nas baterias de questões: depois de escolher a carreira, especialize-se na banca dela.'],
    };
    const banca = BANCAS[p.banca] || BANCAS.Multibanca;
    return `${titulo('Método', 'Rotina diária, revisão espaçada e como a banca cobra.')}

function edParaDef(e, antigo) {

    if (!k) { do { k = 'D' + (++seqDisc); } while (usadas.has(k)); usadas.add(k); }
    const v = velho[k], porTexto = {};
    (v ? v.topicos : []).forEach(t => { if (!porTexto[t.t]) porTexto[t.t] = t.id; });
    let seq = v ? v.seq || v.topicos.length : 0;
    const vistos = new Set();
    const topicos = x.txt.split(/\r?\n/).map(l => l.replace(/^\s*(?:[-•*–]\s*|\d+(?:\.\d+)*[.)]\s+)/, '').trim()).filter(Boolean).map(l => {
      const t = lerTopico(l);

  const j = await (await drive(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id)`)).json();
  return j.files[0] ? j.files[0].id : null;
}
async function gravarArquivo(texto, id, nome = SYNC_ARQ) {
  if (id) return (await drive(`https://www.googleapis.com/upload/drive/v3/files/${id}?uploadType=media&fields=id`, { method: 'PATCH', headers: { 'Content-Type': 'application/octet-stream' }, body: texto })).json();
  const b = 'est' + Math.random().toString(36).slice(2);
  const meta = JSON.stringify({ name: nome, parents: ['appDataFolder'] });
  const corpo = `--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${meta}\r\n--${b}\r\nContent-Type: application/octet-stream\r\n\r\n${texto}\r\n--${b}--`;
  return (await drive('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', { method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${b}` }, body: corpo })).json();
}
const COPIA = 'plano-de-estudos-copia-', COPIAS_MAX = 14;
async function listarCopias() {
  const q = encodeURIComponent(`name contains '${COPIA}' and trashed=false`);
  const j = await (await drive(`https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q=${q}&fields=files(id,name)&pageSize=100`)).json();
  return (j.files || []).filter(f => f.name.startsWith(COPIA)).sort((a, b) => b.name.localeCompare(a.name));
}
async function copiaDiaria(senha) {
  const dia = hoje(), nome = `${COPIA}${dia}.enc`, copias = await listarCopias();
  if (!copias.some(c => c.name === nome)) await gravarArquivo(await cifrar({ modificadoEm: S.modificadoEm, dados: semData(S) }, senha), null, nome);
  for (const c of copias.filter(c => c.name !== nome).slice(COPIAS_MAX - 1)) await drive(`https://www.googleapis.com/drive/v3/files/${c.id}`, { method: 'DELETE' });
  syncCfg.ultimaCopia = dia; lsSet(SYNC_KEY, syncCfg);
}
const diaDaCopia = c => c.name.slice(COPIA.length, COPIA.length + 10);
let copiasVistas = null;
async function verCopias() { try { copiasVistas = await listarCopias(); } catch (e) { return setSync('Não listou as cópias: ' + e.message); } render(); }
async function restaurarCopia(id) {
  const c = (copiasVistas || []).find(x => x.id === id);
  if (!c) return;
  const dia = fmt(diaDaCopia(c));
  if (!confirm(`Restaurar a cópia de ${dia}?\n\nO progresso volta a ser o daquele dia, neste e nos outros aparelhos. O que foi feito depois se perde.`)) return;
  try {
    const txt = await (await drive(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text();
    let pacote, senha = ssGet('est-senha');
    try { pacote = await decifrar(txt, senha); } catch (e) {
      senha = prompt('Essa cópia foi feita com outra senha de sincronização. Digite a senha daquela época:');
      if (senha == null) return;
      try { pacote = await decifrar(txt, senha); } catch (e2) { return setSync('Senha incorreta: a cópia não foi restaurada.'); }
    }
    S = Object.assign(blank(), pacote.dados); commit(); setSync(`Cópia de ${dia} restaurada.`);
  } catch (e) { setSync('Não restaurou: ' + e.message); }
}
const igual = (x, y) => JSON.stringify(x) === JSON.stringify(y);
const ehObj = x => x !== null && typeof x === 'object' && !Array.isArray(x);
const listaComId = a => Array.isArray(a) && a.every(x => ehObj(x) && x.id !== undefined);
const semData = o => { const { modificadoEm, ...dados } = o; return dados; };
const hora = () => new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });
// Mesclagem em três vias: base (última versão sincronizada), este aparelho e o Drive. Só há conflito quando os dois mudaram o mesmo ponto.
function mesclarValor(b, l, r, caminho, conflitos, pref) {
  if (igual(l, r)) return l;
  if (igual(b, l)) return r;
  if (igual(b, r)) return l;
  if (ehObj(l) && ehObj(r) && (b === undefined || ehObj(b))) {
    const out = {};
    new Set([...Object.keys(l), ...Object.keys(r), ...Object.keys(b || {})]).forEach(k => {
      const v = mesclarValor((b || {})[k], l[k], r[k], caminho + '.' + k, conflitos, pref);
      if (v !== undefined) out[k] = v;
    });
    return out;
  }
  if (listaComId(l) && listaComId(r) && (b === undefined || listaComId(b))) return mesclarListas(b || [], l, r, caminho, conflitos, pref);
  conflitos.push(caminho);
  return pref === 'remote' ? r : l;
}
function mesclarListas(b, l, r, caminho, conflitos, pref) {
  const mapa = a => new Map(a.map(x => [x.id, x]));
  const B = mapa(b), L = mapa(l), R = mapa(r), out = [];
  new Set([...L.keys(), ...R.keys(), ...B.keys()]).forEach(id => {
    const bi = B.get(id), li = L.get(id), ri = R.get(id), c = caminho + '#' + id;
    if (li === undefined && ri === undefined) return;
    if (bi === undefined) { out.push(li !== undefined && ri !== undefined ? mesclarValor(undefined, li, ri, c, conflitos, pref) : (li !== undefined ? li : ri)); return; }
    if (li === undefined) { if (!igual(bi, ri)) { conflitos.push(c); if (pref === 'remote') out.push(ri); } return; }
    if (ri === undefined) { if (!igual(bi, li)) { conflitos.push(c); if (pref === 'local') out.push(li); } return; }
    out.push(mesclarValor(bi, li, ri, c, conflitos, pref));
  });
  return out;
}
const baseSync = () => lsGet('est-base', null) || semData(blank());
async function sincronizar() {
  if (sincronizando) { pendente = true; return; }
  const senha = ssGet('est-senha');
  if (!syncCfg.clientId) return setSync('Salve o Client ID do Google Cloud.');
  if (!tokenValido()) return setSync('Conecte ao Google Drive.');
  if (!senha) return setSync('Informe a senha de sincronização e conecte de novo.');
  sincronizando = true;
  setSync('Sincronizando…');
  try {
    const local = semData(S), base = baseSync(), id = await acharArquivo();
    let remoto = null;
    if (id) {
      const txt = await (await drive(`https://www.googleapis.com/drive/v3/files/${id}?alt=media`)).text();
      let pacote;
      try { pacote = await decifrar(txt, senha); } catch (e) { throw new Error('senha de sincronização incorreta'); }
      remoto = semData(pacote.dados);
    }
    let final = local;
    if (remoto) {
      const conflitos = [];
      final = mesclarValor(base, local, remoto, '', conflitos, 'local');
      if (conflitos.length && confirm(`Há ${conflitos.length} ponto(s) alterado(s) nos dois aparelhos.\n\nOK = usar a versão do Drive nesses pontos.\nCancelar = manter a versão deste aparelho.`)) final = mesclarValor(base, local, remoto, '', [], 'remote');
    }
    if (!igual(semData(S), local)) { pendente = true; return setSync('O progresso mudou durante a sincronização; sincronizando de novo…'); }
    S = Object.assign(blank(), final);
    S.modificadoEm = agoraISO();
    salvar(); render();
    if (!remoto || !igual(final, remoto)) {
      const meta = await gravarArquivo(await cifrar({ modificadoEm: S.modificadoEm, dados: semData(S) }, senha), id);
      syncCfg.arquivoId = meta.id; lsSet(SYNC_KEY, syncCfg);
    }
    lsSet('est-base', final);
    if (syncCfg.ultimaCopia !== hoje()) { try { await copiaDiaria(senha); } catch (e) { /* tenta na próxima */ } }
    setSync('Sincronizado às ' + hora());
  } catch (e) {
    const rede = e instanceof TypeError;
    setSync('Não sincronizou: ' + (rede ? 'sem conexão com o Drive' : e.message));
    if (rede) { clearTimeout(novaTentativa); novaTentativa = setTimeout(agendarEnvio, 30000); }
    if (!tokenValido()) renovarSePreciso();
  } finally {
    sincronizando = false;
    if (pendente) { pendente = false; agendarEnvio(); }
    $('aviso').innerHTML = avisoSync();
  }
}
function agendarEnvio() {
  if (!syncPronto()) return;
  if (!tokenValido()) { renovarSePreciso(); return; }
  if (sincronizando) { pendente = true; return; }
  clearTimeout(envioAgendado);
  envioAgendado = setTimeout(sincronizar, 1500);
}
async function trocarSenha() {
  const nova = $('sync-nova').value;
  if (nova.length < 6) return setSync('A nova senha precisa ter pelo menos 6 caracteres.');
  if (!tokenValido() || !ssGet('est-senha')) return setSync('Conecte ao Google Drive antes de trocar a senha.');
  if (!confirm('Trocar a senha de sincronização? Depois, use a nova senha em todos os aparelhos.')) return;
  await sincronizar();
  if (syncEstado.startsWith('Não sincronizou')) return;
  try {
    const id = await acharArquivo();
    if (!id) return setSync('Nada para recifrar ainda: sincronize primeiro.');
    await gravarArquivo(await cifrar({ modificadoEm: S.modificadoEm, dados: semData(S) }, nova), id);
    ssSet('est-senha', nova);
    setSync('Senha trocada. Nos outros aparelhos, digite a nova senha e conecte de novo.');
    render();
  } catch (e) { setSync('Não trocou a senha: ' + e.message); }
}
function blocoSync() {
  const conectado = tokenValido();
  return `
    <section class="card"><h2>Sincronização entre aparelhos (Google Drive)</h2>
      <p class="muted">O progresso vai para uma pasta privada do app no seu Drive, cifrado com a sua senha. Pode usar o mesmo Client ID do Controle Financeiro, desde que o endereço abaixo esteja cadastrado nele no Google Cloud.</p>
      <form class="fields" onsubmit="salvarClientId(event)">
        <label>Client ID do Google Cloud <input id="sync-cid" value="${esc(syncCfg.clientId || '')}" placeholder="xxxxx.apps.googleusercontent.com"></label>
        <button>Salvar Client ID</button>
      </form>
      <p class="muted" style="overflow-wrap:anywhere">Endereço de retorno e origem que devem estar cadastrados: <code>${esc(redirectUri())}</code></p>
      <form class="fields" onsubmit="event.preventDefault();conectarDrive()">
        <label>Senha de sincronização <input id="sync-senha" type="password" autocomplete="off" value="${esc(ssGet('est-senha') || '')}"></label>
        <div class="row"><button>${conectado ? 'Sincronizar agora' : 'Conectar ao Google Drive'}</button>${conectado ? '<button type="button" class="ghost" onclick="desconectarDrive()">Desconectar</button>' : ''}</div>
      </form>
      ${conectado ? `<form class="fields" onsubmit="event.preventDefault();trocarSenha()"><label>Nova senha de sincronização <input id="sync-nova" type="password" autocomplete="off"></label><button>Trocar senha</button></form>
        <div class="row" style="margin-top:10px"><button type="button" class="small" onclick="verCopias()">Ver cópias diárias no Drive</button></div>
        ${copiasVistas ? `<div style="margin-top:8px">${copiasVistas.length ? `<table><tbody>${copiasVistas.map(c => `<tr><td>Cópia de ${fmt(diaDaCopia(c))}</td><td class="num"><button class="small" onclick="restaurarCopia('${c.id}')">Restaurar</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted">Nenhuma cópia ainda. A primeira é feita na próxima sincronização.</p>'}</div>` : ''}` : ''}
      <p class="muted" id="syncstatus">${esc(syncEstado || (conectado ? 'Conectado.' : 'Não conectado.'))}</p>
    </section>`;
}

try { ed = JSON.parse(localStorage.getItem(ED_KEY) || 'null'); } catch (e) { ed = null; }
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
aplicarTema();
lerRetornoOAuth();
try { const k = localStorage.getItem('est-aba'); if (k) aba = k; } catch (e) {}
render();
desenharCrono(true);
setInterval(() => desenharCrono(), 1000);

document.addEventListener('visibilitychange', () => { if (document.hidden || !syncPronto()) return; if (tokenValido()) sincronizar(); else renovarSePreciso(); });
